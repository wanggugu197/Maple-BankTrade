// Maven 仓库配置 - 定义项目依赖的来源
repositories {
    mavenLocal()
    flatDir {
        dir "libs"
    }
    mavenCentral()

    // FTB 系列模组
    maven {
        url "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    // CurseForge 模组仓库
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    exclusiveContent { // Modrinth Maven
        forRepository { maven { url = "https://api.modrinth.com/maven/" } }
        filter { includeGroup("maven.modrinth") }
    }
    // JEI
    maven {
        url "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    // Curios API
    maven {
        url = uri("https://maven.theillusivec4.top/")
        content { includeGroup 'top.theillusivec4.curios' }
    }
    // Create (机械动力)
    maven {
        url = "https://maven.createmod.net"
        content { includeGroup "com.simibubi.create" }
    }
    // TrashSlot
    maven {
        url = "https://maven.twelveiterations.com/repository/maven-public/"
        content { includeGroup "net.blay09.mods" }
    }
    // TerraformersMC - EMI
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content { includeGroup "dev.emi" }
    }
    // shedaniel - REI、Architectury、Cloth Config
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
        }
    }
    // Wisp Forest - Accessories
    maven {
        url = 'https://maven.wispforest.io/releases'
        content { includeGroup "io.wispforest" }
    }

    maven { // AE2
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }

    exclusiveContent { // KubeJS and Rhino
        forRepository { maven { url = "https://maven.latvian.dev/releases" } }
        filter {
            includeGroup("dev.latvian.mods")
            includeGroup("dev.latvian.apps")
        }
    }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    exclusiveContent { // Configuration
        forRepository { maven { url = "https://repo.repsy.io/mvn/toma/public/" } }
        filter { includeGroup('dev.toma.configuration') }
    }
    exclusiveContent { // FTB mods
        forRepository { maven { url = "https://maven.ftb.dev/releases/" } }
        filter { includeGroup("dev.ftb.mods") }
    }
    exclusiveContent { // TOP
        forRepository { maven { url = "https://maven.k-4u.nl/" } }
        filter { includeGroup('mcjty.theoneprobe') }
    }
    exclusiveContent { // JourneyMap API
        forRepository { maven { url = "https://jm.gserv.me/repository/maven-public/" } }
        filter { includeGroup("info.journeymap") }
    }
    exclusiveContent { // tterrag - registrate
        forRepository { maven { url = "https://mvn.devos.one/snapshots/" } }
        filter { includeGroup("com.tterrag.registrate") }
    }
    exclusiveContent { // Curios
        forRepository { maven { url = "https://maven.theillusivec4.top/" } }
        filter { includeGroup('top.theillusivec4.curios')}
    }
    exclusiveContent { // KotlinForForge
        forRepository { maven { url = "https://thedarkcolour.github.io/KotlinForForge/" } }
        filter { includeGroup("thedarkcolour") }
    }
    exclusiveContent { // Argonauts, Heracles
        forRepository { maven { url = "https://maven.teamresourceful.com/repository/maven-public/" } }
        filter {
            includeGroupAndSubgroups("com.teamresourceful")
            includeGroupAndSubgroups("earth.terrarium")
        }
    }
    exclusiveContent { // CC: Tweaked
        forRepository { maven { url = "https://maven.squiddev.cc" } }
        filter { includeGroup("cc.tweaked") }
    }
    exclusiveContent { // This one lib that KJS uses for whatever reason?
        forRepository { maven { url = "https://jitpack.io/" } }
        filter { includeGroup("com.github.rtyley") }
    }

    // 机械动力
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

    // GTO
    maven { url = 'https://maven.gtodyssey.com/releases' }
    // LDLib2
    maven { url = "https://maven.firstdark.dev/snapshots" }
    // Anvil Lib
    maven {
        url = "https://server.cjsah.net:1002/maven/"
        content {
            includeGroup "dev.anvilcraft.lib"
            includeGroup "dev.dubhe"
        }
    }
    // occultism
    maven {
        url "https://dl.cloudsmith.io/public/klikli-dev/mods/maven/"
        content {
            includeGroup "com.klikli_dev"
        }
    }
    // EnderIO
    maven { url 'https://maven.rover656.dev/releases' }
    maven {url 'https://maven.blakesmods.com'}
    maven {url 'https://maven.breakinblocks.com/releases'}
}